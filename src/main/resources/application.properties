server.port=${SERVER_PORT:8088}
lightdb.config-store.directory=${LIGHTDB_DATA_DIR:data}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.cachecontrol.no-store=true
server.error.include-message=never
logging.file.name=logs/light-db-migration.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
